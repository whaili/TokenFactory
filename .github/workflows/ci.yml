name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.24"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod/go.sum is not tidy. Run 'make tidy' and commit."
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          out=$(gofmt -l . | grep -v '^third_party/' | grep -v '^vendor/' || true)
          if [ -n "$out" ]; then
            echo "::error::These files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    # Benchmarks on shared CI runners are noisy and slow; run them only on
    # manual dispatch or on the main branch, not on every PR.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run benchmarks
        run: go test -bench=. -benchmem -run='^$' ./labs/...

      - name: Save benchmark output
        run: |
          mkdir -p bench-results
          go test -bench=. -benchmem -run='^$' ./labs/... | tee "bench-results/$(date +%Y%m%d-%H%M%S).txt"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results/
          if-no-files-found: ignore

  docs:
    name: Docs Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check note structure
        run: bash tools/check-notes.sh

      - name: Verify third-party registry matches the tree
        run: bash tools/sync-vendor.sh --list

  subtree:
    name: Subtree Integrity
    runs-on: ubuntu-latest
    # A subtree import is committed as real files, so a plain clone always
    # has them. This job asserts that invariant: if someone reintroduces
    # submodules, or someone deletes a vendored tree without updating the
    # registry, CI catches it.
    steps:
      - uses: actions/checkout@v4

      - name: Assert no submodules are used
        run: |
          if [ -f .gitmodules ]; then
            echo "::error::This repo intentionally uses git subtree, not submodules. Remove .gitmodules and use 'git subtree add' instead."
            cat .gitmodules
            exit 1
          fi
          echo "✓ no .gitmodules — subtree-only invariant holds"

      - name: Assert every registered project is present
        run: |
          bash tools/sync-vendor.sh --list | tee /tmp/vendor-list.txt
          missing=0
          while read -r dir url ref status; do
            if [ "$status" = "NOT IMPORTED" ]; then
              echo "::error::third_party/$dir is registered but not imported"
              missing=1
            fi
          done < <(tail -n +2 /tmp/vendor-list.txt)
          exit $missing
